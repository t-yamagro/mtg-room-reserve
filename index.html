<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会議室予約システム</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>会議室予約システム</h1>
        
        <div class="room-selection">
            <div class="room-image-container">
                <div class="room-image" data-room="A">
                    <img src="https://www.creationline.com/tech-blog/cms_x3GWkuX/wp-content/uploads/2024/04/main1.webp" alt="会議室A">
                    <p>会議室A</p>
                </div>
                <div class="room-image" data-room="B">
                    <img src="https://www.creationline.com/tech-blog/cms_x3GWkuX/wp-content/uploads/2024/04/main4.webp" alt="会議室B">
                    <p>会議室B</p>
                </div>
            </div>
        </div>

        <form id="reservationForm" class="reservation-form">
            <div class="form-group">
                <label for="room">会議室:</label>
                <select id="room" name="room" required>
                    <option value="">選択してください</option>
                    <option value="A">会議室A</option>
                    <option value="B">会議室B</option>
                </select>
            </div>

            <div class="form-group">
                <label for="startTime">利用開始日時:</label>
                <input type="datetime-local" id="startTime" name="startTime" required>
            </div>

            <div class="form-group">
                <label for="endTime">利用終了日時:</label>
                <input type="datetime-local" id="endTime" name="endTime" required>
            </div>

            <div class="form-group">
                <label for="name">予約者名:</label>
                <input type="text" id="name" name="name" required>
            </div>

            <button type="submit" class="submit-button">予約する</button>
        </form>

        <div id="reservationList" class="reservation-list">
            <h2>予約一覧</h2>
            <div id="reservations"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
